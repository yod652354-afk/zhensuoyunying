services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicos
      POSTGRES_PASSWORD: clinicos
      POSTGRES_DB: clinicos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinicos:clinicos@db:5432/clinicos
      API_KEYS: ${API_KEYS:-dev-key-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: